name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: cargo test --locked
      # The exe is built to prove it builds; it is not uploaded (nobody downloads it,
      # and releases ship from release.yml).
      - name: Build NachoCombo.exe (release)
        run: cargo build --release --locked
