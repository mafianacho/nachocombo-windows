name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build, package and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$REF_NAME' is not vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          version="${REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$version" != "$cargo_version" ]; then echo "tag $version but Cargo.toml says $cargo_version" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: cargo test --locked
      - name: Build NachoCombo.exe (release)
        run: cargo build --release --locked
      - name: Verify the executable
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          $info = (Get-Item target/release/NachoCombo.exe).VersionInfo
          if ($info.ProductVersion -ne $env:VERSION) { throw "version resource says $($info.ProductVersion)" }
          if (Select-String -Path target/release/NachoCombo.exe -Pattern 'C:\\Users\\|D:\\a\\' -SimpleMatch:$false -Quiet) { throw "build-machine path embedded in the exe" }
      - name: Package (zip, SHA256SUMS)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist/pkg
          cp target/release/NachoCombo.exe README.md LICENSE assets/fonts/*-OFL.txt dist/pkg/
          (cd dist/pkg && 7z a -tzip "../NachoCombo-windows-$VERSION-x64.zip" . >/dev/null)
          rm -rf dist/pkg
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          NachoCombo for Windows $VERSION for Windows 10 and 11 (x64). One portable exe: unzip and run, no installer and no administrator rights.

          **Not code-signed yet.** On first launch Windows SmartScreen may say "Windows protected your PC": choose More info, then Run anyway.

          Verify your download against \`SHA256SUMS.txt\`:
          \`certutil -hashfile NachoCombo-windows-$VERSION-x64.zip SHA256\`
          NOTES
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "NachoCombo for Windows $VERSION" \
            --notes-file notes.md
